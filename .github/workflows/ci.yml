name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opflow_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000000
      # tests/global-setup.ts resets the schema of the disposable Postgres service
      # container above (never a real database - it's created fresh for this job and
      # discarded after) via `prisma db push --force-reset`. Prisma's CLI requires this
      # env var before an AI-driven caller can run that command; here it's CI running a
      # workflow file that a human reviewed and merged, which is this project's
      # equivalent of the interactive consent that gate normally asks for.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "CI runs tests/global-setup.ts against an ephemeral CI-only Postgres service container, never a real database - approved via review of this workflow file."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
